[package]
name = "crosshair"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "crosshair"
path = "src/lib.rs"

[[bin]]
name = "crosshair"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.20.0", default-features = false }
